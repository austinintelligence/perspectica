[package]
name = "perspectica-installer"
version = "0.1.0"
edition = "2021"
description = "A small, safe helper for verifying and loading Perspectica release artifacts"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
